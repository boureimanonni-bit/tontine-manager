<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tontine Manager</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}
header{background:#1677ff;color:white;padding:20px;text-align:center}
main{max-width:600px;margin:auto;padding:16px}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:8px;border-radius:9px;font-size:16px}
input{border:1px solid #ccc}
button{border:0;background:#1677ff;color:white;font-weight:bold}
button.secondary{background:#555}
.member{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:12px 0}
.member:last-child{border-bottom:0}
.paid{color:green;font-weight:bold}.unpaid{color:#d33;font-weight:bold}
.small{font-size:13px;color:#666}
.total{font-size:24px;font-weight:bold;color:#1677ff}
</style>
</head>
<body>
<header><h1>💰 Tontine Manager</h1><div>Gestion simple de votre tontine</div></header>
<main>
<div class="card">
<h2>Nouvelle tontine</h2>
<input id="amount" type="number" placeholder="Cotisation par membre (FCFA)">
<button onclick="saveAmount()">Enregistrer le montant</button>
<p class="small" id="amountInfo"></p>
</div>

<div class="card">
<h2>Ajouter un membre</h2>
<input id="name" type="text" placeholder="Nom du membre">
<button onclick="addMember()">Ajouter</button>
</div>

<div class="card">
<h2>Résumé</h2>
<div>Total collecté : <span class="total" id="total">0 FCFA</span></div>
<div id="count" class="small"></div>
</div>

<div class="card">
<h2>Membres</h2>
<div id="members"></div>
</div>

<div class="card">
<button class="secondary" onclick="resetAll()">Réinitialiser la tontine</button>
</div>
</main>

<script>
let amount = Number(localStorage.getItem("tontineAmount")) || 0;
let members = JSON.parse(localStorage.getItem("tontineMembers") || "[]");

function save(){
 localStorage.setItem("tontineAmount", amount);
 localStorage.setItem("tontineMembers", JSON.stringify(members));
}
function saveAmount(){
 const v=Number(document.getElementById("amount").value);
 if(v<=0){alert("Entre un montant valide.");return;}
 amount=v; save(); render();
}
function addMember(){
 const input=document.getElementById("name");
 const name=input.value.trim();
 if(!name){alert("Entre le nom du membre.");return;}
 members.push({name:name,paid:false});
 input.value=""; save(); render();
}
function togglePaid(i){
 members[i].paid=!members[i].paid; save(); render();
}
function removeMember(i){
 if(confirm("Supprimer ce membre ?")){members.splice(i,1);save();render();}
}
function resetAll(){
 if(confirm("Tout supprimer ?")){
  amount=0;members=[];localStorage.clear();render();
 }
}
function render(){
 document.getElementById("amount").value=amount||"";
 document.getElementById("amountInfo").textContent=amount?`Cotisation : ${amount.toLocaleString("fr-FR")} FCFA par membre`:"";
 const total=members.filter(m=>m.paid).length*amount;
 document.getElementById("total").textContent=total.toLocaleString("fr-FR")+" FCFA";
 document.getElementById("count").textContent=`${members.filter(m=>m.paid).length} payé(s) sur ${members.length}`;
 const box=document.getElementById("members");
 box.innerHTML="";
 if(!members.length){box.innerHTML='<p class="small">Aucun membre pour le moment.</p>';return;}
 members.forEach((m,i)=>{
  const div=document.createElement("div");div.className="member";
  div.innerHTML=`<div><strong>${escapeHtml(m.name)}</strong><br><span class="${m.paid?'paid':'unpaid'}">${m.paid?'✅ Payé':'❌ Non payé'}</span></div>
  <div><button onclick="togglePaid(${i})">${m.paid?'Annuler':'Marquer payé'}</button><button class="secondary" onclick="removeMember(${i})">Supprimer</button></div>`;
  box.appendChild(div);
 });
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
render();
</script>
</body>
</html>
